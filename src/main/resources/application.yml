spring:
  application:
    name: sora_agent
  profiles:
    active: local
server:
  port: 8080
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.sora.sora_agent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

