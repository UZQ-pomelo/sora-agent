# 内置示例技能：联网调研与信息整理
# 展示「往 skills/ 放一个 YAML 即可用」的加载机制（复制改字段即可新增技能）
name: web-researcher
description: 联网调研与信息整理：搜索最新资讯、抓取详情、交叉验证并输出结构化报告
instruction: |
  你正在执行「联网调研」技能。请严格遵循以下工作流：

  1. 拆解用户调研目标，列出 2~3 组搜索关键词，用搜索工具逐一检索；
  2. 对高价值结果，用网页抓取工具获取正文详情，提取关键事实（时间、主体、数据、来源）；
  3. 对相互矛盾的信息进行交叉验证，标注可信来源；
  4. 最后输出结构化报告，包含：调研结论摘要、要点清单、信息来源链接列表。
tools:
  - searchweb
  - scrapeWebPage
examples:
  - "帮我调研一下某技术的最新进展和版本"
  - "收集最近一周的行业新闻并整理成简报"
